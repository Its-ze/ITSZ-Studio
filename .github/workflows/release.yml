name: Release installers and Pages

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  attestations: write
  artifact-metadata: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
            command: npm run dist:win
          - os: ubuntu-latest
            name: linux
            command: npm run dist:linux
    runs-on: ${{ matrix.os }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      RELEASE_VERSION: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run validate
      - run: ${{ matrix.command }}
      - name: Attest public release artifacts
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: |
            release/*.AppImage
            release/*.blockmap
            release/*.deb
            release/*.exe
            release/*.rpm
            release/latest*.yml
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-${{ matrix.name }}
          path: |
            release/*.AppImage
            release/*.blockmap
            release/*.deb
            release/*.exe
            release/*.rpm
            release/latest*.yml
          if-no-files-found: error

  pages:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: site/downloads/releases
      - run: |
          cp installers/windows/install-itsz-studio.ps1 site/downloads/install-windows.ps1
          cp installers/linux/install-itsz-studio.sh site/downloads/install-linux.sh
          cp assets/icon.svg site/icon.svg
          cp assets/icon.png site/icon.png
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - run: node scripts/prepare-pages.mjs
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
          PAGES_BASE_URL: https://its-ze.github.io/ITSZ-Studio/downloads
      - run: node scripts/verify-release-manifest.mjs
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
